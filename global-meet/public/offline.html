<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 — 연결.잇다.</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        background: #f8fafc; color: #1e293b;
        font-family: Inter, system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
        padding: 24px; text-align: center;
      }
      .card {
        background: #fff; border: 1px solid #e2e8f0; border-radius: 20px;
        padding: 40px 28px; max-width: 360px; width: 100%;
        box-shadow: 0 1px 3px rgb(0 0 0 / 6%);
      }
      .icon { font-size: 44px; line-height: 1; margin-bottom: 16px; }
      h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
      p { font-size: 14px; color: #64748b; line-height: 1.6; }
      button {
        margin-top: 24px; width: 100%; padding: 12px;
        background: #4f46e5; color: #fff; border: 0; border-radius: 12px;
        font-size: 14px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>인터넷에 연결되어 있지 않습니다</h1>
      <p>네트워크를 확인한 뒤 다시 시도해 주세요.<br />연결되면 마지막 화면으로 돌아갑니다.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
    <script>
      // 온라인으로 바뀌면 자동으로 복귀
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
